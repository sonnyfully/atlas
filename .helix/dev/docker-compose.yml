# Generated docker-compose.yml for Helix instance: dev
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      
    image: helix-atlas-dev:dev
    container_name: helix-atlas-dev_app
    ports:
      - "6969:6969"
    volumes:
      - ../.volumes/dev:/data
    environment:
      - HELIX_PORT=6969
      - HELIX_DATA_DIR=/data
      - HELIX_INSTANCE=dev
      - HELIX_PROJECT=atlas
    restart: unless-stopped
    networks:
      - helix-atlas-dev_net

networks:
  helix-atlas-dev_net:
    driver: bridge
